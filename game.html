<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* 覆盖页面背景 */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: none; /* 默认隐藏 */
    }

    /* 对话框样式 */
    #customPrompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
    }

    /* 按钮样式 */
    button {
      padding: 10px 20px;
      margin-top: 10px;
    }
  </style>
  <title>Custom Prompt</title>
</head>
<body>

<!-- 覆盖层 -->
<div id="overlay">
  <div id="customPrompt">
    <p>请输入一个数字:</p>
    <input type="text" id="userInput">
    <button onclick="submitInput()">提交</button>
  </div>
</div>

<!-- 按钮触发自定义 prompt -->
<button onclick="showPrompt()">弹出输入框</button>

<script>
  // 显示自定义 prompt
  function showPrompt() {
    document.getElementById("overlay").style.display = "block";
  }

  // 获取用户输入并关闭 prompt
  function submitInput() {
    let input = document.getElementById("userInput").value;
    alert("你输入的数字是: " + input);
    document.getElementById("overlay").style.display = "none";
  }
let randomNumber = Math.floor(Math.random() * 100) + 1;
let guess = null;
let attempts = 0;

while (guess !== randomNumber) {
    guess = parseInt(prompt("猜一个 1 到 100 之间的数字:"));
    attempts++;
    
    if (guess > randomNumber) {
        alert("太大了！");
    } else if (guess < randomNumber) {
        alert("太小了！");
    } else if (guess === randomNumber) {
        alert(`恭喜，你猜对了！你总共猜了 ${attempts} 次。`);
    }
}
</script>

</body>
</html>
